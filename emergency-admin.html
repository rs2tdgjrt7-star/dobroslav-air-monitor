<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Доброслав — аварійні повідомлення</title><style> *{box-sizing:border-box}body{font:16px system-ui;background:#eef2f6;color:#172536;margin:0}main{max-width:850px;margin:auto;padding:16px}section,article{background:white;border:1px solid #d5dde6;border-radius:14px;padding:16px;margin:12px 0}h1{font-size:25px}h2{font-size:20px}label{display:block;margin:12px 0 4px;font-weight:600}input,select,textarea,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #aab8c7;width:100%}button{background:#1757a6;color:white;border:0;margin:6px 0;cursor:pointer}button.secondary{background:#e5edf6;color:#183957}button:disabled{opacity:.5}textarea{min-height:90px}small{color:#526477}pre{white-space:pre-wrap;overflow-wrap:anywhere}#notice{white-space:pre-wrap} .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:550px){.grid{grid-template-columns:1fr}}.back-map{display:block;background:#1757a6;color:white;text-decoration:none;text-align:center;padding:12px;border-radius:8px;margin:16px 0;font-weight:600}.back-map:focus-visible{outline:3px solid #183957;outline-offset:3px}</style><main><h1>Доброслав — аварійні повідомлення</h1><small>Панель адміністратора · 1.0.1</small><a class="back-map" href="./index.html">← Повернутися до карти</a><section><label for="key">Ключ адміністратора</label><input id="key" type="password" autocomplete="off" placeholder="Введіть секретний ключ"><button id="lock" class="secondary">Очистити ключ</button><small>Ключ не записується у файл або локальне сховище.</small></section><section id="notice" role="status">Готово до перевірки.</section><section><h2 id="heading">Нове повідомлення</h2><form id="editor"><label>Населений пункт<input name="settlement" required placeholder="Доброслав"></label><label>Категорія<select name="category"><option value="electricity">Електропостачання</option><option value="water">Водопостачання</option><option value="other">Інше</option></select></label><label>Заголовок<input name="title" required></label><label>Опис<textarea name="description" required></textarea></label><label>Причина<input name="reason"></label><div class="grid"><label>Початок (час Києва)<input name="started_at" type="datetime-local"></label><label>Орієнтовне відновлення (час Києва)<input name="estimated_restore_at" type="datetime-local"></label></div><label>Джерело інформації<input name="source" required></label><button id="save">Опублікувати повідомлення</button><button type="button" id="reset" class="secondary">Очистити форму</button></form></section><section><h2>Повідомлення</h2><div class="grid"><button id="active">Активні</button><button id="all" class="secondary">Усі / архів</button></div><div id="list"></div></section></main><script>
'use strict';const API='https://dobroslav-emergency-api.gw85rpjd2z.workers.dev';const $=id=>document.getElementById(id);let editing=null,all=false,busy=false;const form=$('editor');const fields=['settlement','category','title','description','reason','started_at','estimated_restore_at','source'];const dates=['started_at','estimated_restore_at'];const fmt=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Kyiv',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'});function parse(v){return new Date(/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(v)?v.replace(' ','T')+'Z':v)}function local(v){return v?fmt.format(parse(v)).replace(' ','T'):''}function iso(v){if(!v)return null;let t=Date.parse(v+'Z');for(let i=0;i<3;i++){let shown=Date.parse(fmt.format(new Date(t)).replace(' ','T')+'Z');t+=Date.parse(v+'Z')-shown}if(local(new Date(t).toISOString())!==v)throw Error('Некоректний час Києва');return new Date(t).toISOString()}function note(s){$('notice').textContent=s}async function req(path,method='GET',body){const headers={};if(method!=='GET'){if(!$('key').value.trim())throw Error('Введіть ключ адміністратора');headers.Authorization='Bearer '+$('key').value.trim();headers['Content-Type']='application/json'}const r=await fetch(API+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});let j;try{j=await r.json()}catch{throw Error('HTTP '+r.status)}if(!r.ok||j.ok!==true)throw Error('HTTP '+r.status+': '+(j.error||'Помилка API'));return j}function reset(){editing=null;HTMLFormElement.prototype.reset.call(form);$('heading').textContent='Нове повідомлення';$('save').textContent='Опублікувати повідомлення'}function edit(m){editing=m.id;for(const f of fields){form.elements[f].value=dates.includes(f)?local(m[f]):(m[f]??'')}if(!form.elements.category.value){const o=new Option(m.category,m.category);form.elements.category.add(o);form.elements.category.value=m.category}$('heading').textContent='Редагування №'+m.id;$('save').textContent='Зберегти зміни';form.scrollIntoView({behavior:'smooth'})}function btn(label,fn,parent){const b=document.createElement('button');b.textContent=label;b.className='secondary';b.onclick=fn;parent.append(b)}async function action(fn){if(busy)return;busy=true;try{await fn()}catch(e){note(e.message+' — якщо запис уже надіслано, перевірте список перед повтором.')}finally{busy=false}}async function load(){const j=await req('/messages'+(all?'?status=all':''));$('list').replaceChildren();const p=document.createElement('p');p.textContent='Записів: '+j.count;$('list').append(p);for(const m of j.messages){const a=document.createElement('article');const h=document.createElement('h3');h.textContent='#'+m.id+' · '+m.settlement+' — '+m.title;a.append(h);const t=document.createElement('pre');t.textContent=[m.description,'Статус: '+({active:'Активне',resolved:'Відновлено',cancelled:'Скасовано'}[m.status]||m.status),'Причина: '+(m.reason||'Не визначено'),'Початок: '+(local(m.started_at)||'Не визначено'),'Прогноз: '+(local(m.estimated_restore_at)||'Не визначено'),'Джерело: '+m.source].join('\n');a.append(t);if(m.status==='active'){btn('Редагувати',()=>edit(m),a);for(const [status,label] of [['resolved','Відновлено'],['cancelled','Скасувати']])btn(label,()=>action(async()=>{if(!confirm(label+' повідомлення №'+m.id+'?'))return;await req('/admin/messages/'+m.id,'PATCH',status==='resolved'?{status,restored_at:new Date().toISOString()}:{status});note('Статус оновлено');await load()}),a)}btn('Історія змін',()=>action(async()=>{const j=await req('/messages/'+m.id+'/history');const pre=document.createElement('pre');pre.textContent=j.history.map(x=>local(x.changed_at)+' · '+x.field_name+': '+(x.old_value??'—')+' → '+(x.new_value??'—')).join('\n')||'Змін немає';a.append(pre)}),a);$('list').append(a)}}form.onsubmit=e=>{e.preventDefault();action(async()=>{const body={};for(const f of fields)body[f]=dates.includes(f)?iso(form.elements[f].value):form.elements[f].value.trim();if(!confirm(editing?'Зберегти зміни?':'Опублікувати повідомлення?'))return;$('save').disabled=true;try{await req('/admin/messages'+(editing?'/'+editing:''),editing?'PATCH':'POST',body);reset();note('Запис збережено');await load()}finally{$('save').disabled=false}})};$('reset').onclick=reset;$('lock').onclick=()=>{$('key').value='';note('Ключ очищено')};$('active').onclick=()=>action(async()=>{all=false;await load()});$('all').onclick=()=>action(async()=>{all=true;await load()});action(load);
</script></html>
